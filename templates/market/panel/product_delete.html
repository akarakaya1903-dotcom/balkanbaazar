{% extends "base.html" %}
{% block title %}{{ t.delete }} — {{ item.title }}{% endblock %}
{% block content %}
<div class="wrap"><div class="panelgrid">
  {% include "market/panel/_nav.html" with section='products' %}
  <main>
    <div class="formcard">
      <h2>{{ t.sure_delete }}</h2>
      <p class="lead">{{ item.title }}</p>
      <form method="post">{% csrf_token %}
        <div class="formact">
          <button class="btn-danger" type="submit">{{ t.delete }}</button>
          <a class="btn-line" href="{% url 'market:panel_products' %}">{{ t.cancel }}</a>
        </div>
      </form>
    </div>
  </main>
</div></div>
{% endblock %}
