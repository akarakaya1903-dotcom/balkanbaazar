{% extends "base.html" %}
{% block title %}{{ t.a_del_t }} — {{ t.brand }}{% endblock %}
{% block content %}
<div class="wrap"><div class="authwrap"><div class="authbox">
<h1>{{ t.a_del_t }}</h1>
<p>{{ t.a_del_p }}</p>
<form method="post">{% csrf_token %}
  {% if has_pw %}<label>{{ t.a_pw_label }}<input type="password" name="password" required autocomplete="current-password"></label>
  {% else %}<label>{{ t.a_del_email }}<input type="email" name="confirm" required></label>{% endif %}
  <button class="btn-sea" type="submit" style="background:#C0392B;margin-top:10px">{{ t.a_del_btn }}</button>
</form>
<p class="authalt"><a href="{% url 'market:profile' %}">{{ t.a_cancel }}</a></p>
</div></div></div>
{% endblock %}
