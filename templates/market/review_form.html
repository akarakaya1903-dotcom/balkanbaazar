{% extends "base.html" %}
{% block title %}{{ t.write_review }} — {{ item.title }}{% endblock %}
{% block content %}
<div class="wrap"><section class="sect">
  <div class="formcard" style="max-width:480px;margin:0 auto">
    <h1>{{ t.write_review }}</h1>
    <p class="lead">{{ item.title }}</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "market/_form.html" %}
      <div class="formact">
        <button class="btn-sea" type="submit">{{ t.save }}</button>
        <a class="btn-line" href="{% url 'market:my_orders' %}">{{ t.cancel }}</a>
      </div>
    </form>
  </div>
</section></div>
{% endblock %}
