{# Basitlestirilmis SVG bayraklar. Emoji degil, her platformda ayni gorunur. #}
<svg class="flagsvg" viewBox="0 0 36 24" role="img" aria-label="{{ c.code }}">
  <defs><clipPath id="fc{{ c.code }}"><rect width="36" height="24" rx="3"/></clipPath></defs>
  <g clip-path="url(#fc{{ c.code }})">
  {% if c.code == 'MK' %}
    <rect width="36" height="24" fill="#D20000"/>
    <g fill="#F8E71C"><circle cx="18" cy="12" r="4"/>
      <polygon points="18,12 0,0 5,0"/><polygon points="18,12 36,0 31,0"/>
      <polygon points="18,12 0,24 5,24"/><polygon points="18,12 36,24 31,24"/>
      <polygon points="18,12 0,9 0,15"/><polygon points="18,12 36,9 36,15"/>
      <polygon points="18,12 15,0 21,0"/><polygon points="18,12 15,24 21,24"/></g>
  {% elif c.code == 'AL' %}
    <rect width="36" height="24" fill="#E41E20"/>
    <path d="M18 6l3 3 3-2-1 4 3 2-4 1 1 4-5-3-5 3 1-4-4-1 3-2-1-4 3 2z" fill="#111"/>
  {% elif c.code == 'XK' %}
    <rect width="36" height="24" fill="#244AA5"/>
    <path d="M12 12l3-3 4 1 5-1 2 3-3 4-5 2-5-2z" fill="#D0A650"/>
    <g fill="#fff"><circle cx="11" cy="6" r="1"/><circle cx="14.5" cy="4.6" r="1"/>
      <circle cx="18" cy="4.2" r="1"/><circle cx="21.5" cy="4.6" r="1"/><circle cx="25" cy="6" r="1"/></g>
  {% elif c.code == 'RS' %}
    <rect width="36" height="8" fill="#C6363C"/><rect y="8" width="36" height="8" fill="#0C4076"/>
    <rect y="16" width="36" height="8" fill="#fff"/>
  {% elif c.code == 'ME' %}
    <rect width="36" height="24" fill="#C40308"/><rect x="1.5" y="1.5" width="33" height="21" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
    <circle cx="18" cy="12" r="4.5" fill="#D4AF37"/>
  {% elif c.code == 'BA' %}
    <rect width="36" height="24" fill="#002395"/>
    <polygon points="10,0 28,0 28,24" fill="#FECB00"/>
    <g fill="#fff"><circle cx="9" cy="3" r="1.1"/><circle cx="13" cy="7" r="1.1"/>
      <circle cx="17" cy="11" r="1.1"/><circle cx="21" cy="15" r="1.1"/><circle cx="25" cy="19" r="1.1"/></g>
  {% elif c.code == 'BG' %}
    <rect width="36" height="8" fill="#fff"/><rect y="8" width="36" height="8" fill="#00966E"/>
    <rect y="16" width="36" height="8" fill="#D62612"/>
  {% elif c.code == 'GR' %}
    <rect width="36" height="24" fill="#0D5EAF"/>
    <g fill="#fff"><rect y="2.7" width="36" height="2.7"/><rect y="8.1" width="36" height="2.7"/>
      <rect y="13.5" width="36" height="2.7"/><rect y="18.9" width="36" height="2.7"/></g>
    <rect width="13.5" height="13.5" fill="#0D5EAF"/>
    <g fill="#fff"><rect x="5.4" width="2.7" height="13.5"/><rect y="5.4" width="13.5" height="2.7"/></g>
  {% endif %}
  </g>
  <rect width="36" height="24" rx="3" fill="none" stroke="rgba(0,0,0,.18)"/>
</svg>
